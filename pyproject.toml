# Lint settings for the Python code (backend, notifier, tools and tests). Run it with:  ruff check .
[tool.ruff]
target-version = "py37"  # the oldest Python install.sh accepts
line-length = 320
extend-exclude = ["tests/backend/fixtures", "tests/e2e/.work", "tests/e2e/shims", "*.ipynb"]

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = [
    "B905",  # zip(strict=) needs Python 3.10
]

[tool.ruff.lint.per-file-ignores]
# the browser tests share their helpers with `from uilib import *` and define small callbacks inside their loops
"tests/ui/*" = ["F403", "F405", "B023"]

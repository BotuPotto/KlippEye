name: Tests

# Runs the automatic tests on every pull request and on every push to main.
# The same tests run locally with:  bash tests/run_all.sh   (see tests/README.md)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, notifier, app CI, frontend build
    runs-on: ubuntu-24.04   # pinned: Playwright 1.56 installs its system libraries on 24.04 (ubuntu-latest moves to 26)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the Python packages
        run: pip install flask waitress requests werkzeug numpy opencv-python-headless cryptography pillow playwright==1.56.0
      - name: Install Chromium (the notifier integration test starts the dashboard stand-in)
        # the system libraries come from Ubuntu's archive; when the runners cannot reach it the image's own libraries
        # (Chrome is preinstalled on it) are enough to run Chromium
        run: |
          python -m playwright install --with-deps chromium || { echo "::warning::Ubuntu's archive not reachable, Chromium without --with-deps"; python -m playwright install chromium; }
      - name: Lint the Python code (settings in pyproject.toml)
        run: |
          pip install ruff==0.16.9
          ruff check .
      - name: Run the tests (no browser tests)
        run: bash tests/run_all.sh --no-ui

  ui:
    name: Dashboard in the browser
    runs-on: ubuntu-24.04   # pinned: Playwright 1.56 installs its system libraries on 24.04 (ubuntu-latest moves to 26)
    timeout-minutes: 90     # the tests take about 50 minutes; a slow Ubuntu archive adds several to the installation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the Python packages
        run: pip install flask waitress requests werkzeug numpy opencv-python-headless pillow playwright==1.56.0
      - name: Install Chromium
        # the system libraries come from Ubuntu's archive; when the runners cannot reach it the image's own libraries
        # (Chrome is preinstalled on it) are enough to run Chromium
        run: |
          python -m playwright install --with-deps chromium || { echo "::warning::Ubuntu's archive not reachable, Chromium without --with-deps"; python -m playwright install chromium; }
      - name: Run the browser tests
        run: bash tests/ui/run_all.sh "$RUNNER_TEMP/ui"
      - name: Keep the screenshots and logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-output
          path: ${{ runner.temp }}/ui
          retention-days: 7

  local-model:
    name: Local model (training chain)
    # ml/: the list of pictures, a short training on synthetic pictures, the export checked against OpenCV, the
    # measurement on a KlippEye data folder (ml/tests/smoke_train.py). PyTorch is only needed here, never on the Raspberry.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch (CPU) and the tools
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/requirements.txt
      - name: Run the chain
        run: python ml/tests/smoke_train.py

  app:
    name: Android app compiles
    # The APK is published by app.yml only after a merge into main: this job compiles the app on every pull request
    # (debug build, no signing key and no Firebase file needed), so a mistake in the Kotlin code is seen before the merge; the tests of app/src/test run too.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the app (debug) and run its tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest

name: App Android

# Costruisce l'APK dell'app KlippEye sul computer di GitHub, lo firma e lo mette nella cartella apk/ del repository.
# Il Raspberry lo riceve con il normale «Aggiorna» di KlippEye e la dashboard (Impostazioni → Aggiornamenti → App Android)
# lo offre al telefono. Si mette in moto da solo quando in android/ cambia qualcosa E il numero in android/VERSION è nuovo;
# oppure a mano da Actions → App Android → Run workflow.
# Cosa serve e come si fa: docs/GUIDA.md, «L'app Android». I passi veri sono in ci/app_ci.py (provato a parte).

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/app.yml'
      - 'ci/app_ci.py'
  workflow_dispatch:
    inputs:
      forza:
        description: 'Ricostruisci anche se la versione in android/VERSION è già stata pubblicata'
        type: boolean
        default: false
      nuova_chiave:
        description: 'Ammetti una chiave di firma diversa da quella dell’app già pubblicata (i telefoni dovranno disinstallare e reinstallare l’app una volta)'
        type: boolean
        default: false

# Serve per salvare l'APK nel repository alla fine
permissions:
  contents: write

# Un solo lavoro alla volta: due costruzioni insieme si pesterebbero i piedi
concurrency:
  group: app-android
  cancel-in-progress: false

jobs:
  costruisci:
    name: Costruisci e pubblica l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # La chiave di firma sta in android/chiave/klippeye.p12 (criptata); la password è il segreto che hai creato su GitHub
      KLIPPEYE_KEYSTORE: ${{ github.workspace }}/android/chiave/klippeye.p12
      # (se hai ancora il vecchio segreto VZBOT_CHIAVE_PASSWORD va bene lo stesso: vale come password della nuova chiave)
      KLIPPEYE_KEYSTORE_PASSWORD: ${{ secrets.KLIPPEYE_CHIAVE_PASSWORD || secrets.VZBOT_CHIAVE_PASSWORD }}
      # Facoltativo: il file di Firebase per le notifiche (senza, l'app si costruisce lo stesso ma senza notifiche)
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Scarica i file del repository
        uses: actions/checkout@v4

      - name: Serve una nuova app?
        id: decidi
        env:
          FORZA: ${{ inputs.forza }}
          EVENTO: ${{ github.event_name }}
        run: python3 ci/app_ci.py decidi --forza "$FORZA" --evento "$EVENTO"

      - name: Prepara Java
        if: steps.decidi.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara l'SDK di Android
        if: steps.decidi.outputs.build == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Prepara Gradle (con la memoria delle volte scorse)
        if: steps.decidi.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Chiave di firma (la crea la prima volta)
        if: steps.decidi.outputs.build == 'true'
        run: python3 ci/app_ci.py chiave

      - name: Notifiche (google-services.json, se c'è)
        if: steps.decidi.outputs.build == 'true'
        run: python3 ci/app_ci.py google

      - name: Costruisci l'APK
        if: steps.decidi.outputs.build == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Controlla l'APK e mettilo in apk/
        if: steps.decidi.outputs.build == 'true'
        env:
          NUOVA_CHIAVE: ${{ inputs.nuova_chiave }}
        run: python3 ci/app_ci.py pubblica --nuova-chiave "$NUOVA_CHIAVE" --sorgente "$GITHUB_SHA"

      - name: Salva nel repository
        if: steps.decidi.outputs.build == 'true'
        env:
          RAMO: ${{ github.ref_name }}
          VERSIONE: ${{ steps.decidi.outputs.version }}
        run: python3 ci/app_ci.py salva --ramo "$RAMO" --messaggio "App Android $VERSIONE (APK costruito da GitHub) [skip ci]"

      - name: Riepilogo
        if: always()
        env:
          COSTRUITA: ${{ steps.decidi.outputs.build }}
          VERSIONE: ${{ steps.decidi.outputs.version }}
          MOTIVO: ${{ steps.decidi.outputs.motivo }}
          ESITO: ${{ job.status }}
        run: |
          {
            echo "### App Android"
            if [ "$ESITO" = "success" ] && [ "$COSTRUITA" = "true" ]; then
              echo "App **$VERSIONE** costruita e salvata in \`apk/\`. Sul Raspberry: dashboard → Impostazioni → Aggiornamenti → «Controlla», poi «Aggiorna KlippEye»; infine «Aggiorna l'app» sul telefono."
            elif [ "$ESITO" = "success" ]; then
              echo "Niente da costruire: $MOTIVO."
            else
              echo "Qualcosa non è andato: apri il passo con la X rossa qui sopra, il messaggio dice cosa fare."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

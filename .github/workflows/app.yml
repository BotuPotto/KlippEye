name: Android app

# Builds the APK of the KlippEye app on GitHub's computer, signs it and puts it in the repository's apk/ folder.
# The Raspberry receives it with KlippEye's normal update, and the dashboard (Settings → Updates → Android app) offers it
# to the phone. It starts by itself when something changes in android/ AND the number in android/VERSION is new, or by
# hand from Actions → Android app → Run workflow.
# What is needed and how: docs/GUIDE.md, «Building your own Android app». The real steps are in ci/app_ci.py (tested apart).

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/app.yml'
      - 'ci/app_ci.py'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build again even if the version in android/VERSION is already published'
        type: boolean
        default: false
      new_key:
        description: 'Allow a signing key different from the published app''s (the phones will have to uninstall and install the app again, once)'
        type: boolean
        default: false

# Needed to save the APK in the repository at the end
permissions:
  contents: write

# One run at a time: two builds together would get in each other's way
concurrency:
  group: app-android
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The signing key is in android/chiave/klippeye.p12 (encrypted); its password is the secret created on GitHub.
      # (The folder and the secrets keep their first names: renaming them would break the repositories that build the app.)
      KLIPPEYE_KEYSTORE: ${{ github.workspace }}/android/chiave/klippeye.p12
      KLIPPEYE_KEYSTORE_PASSWORD: ${{ secrets.KLIPPEYE_CHIAVE_PASSWORD || secrets.VZBOT_CHIAVE_PASSWORD }}
      # Optional: Firebase's file for the notifications (without it the app is built anyway, without notifications)
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Is a new app needed?
        id: decide
        env:
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: python3 ci/app_ci.py decide --force "$FORCE" --event "$EVENT"

      - name: Set up Java
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        if: steps.decide.outputs.build == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle (with the cache of the earlier runs)
        if: steps.decide.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Signing key (made the first time)
        if: steps.decide.outputs.build == 'true'
        run: python3 ci/app_ci.py key

      - name: Notifications (google-services.json, if any)
        if: steps.decide.outputs.build == 'true'
        run: python3 ci/app_ci.py google

      - name: Build the APK
        if: steps.decide.outputs.build == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Check the APK and put it in apk/
        if: steps.decide.outputs.build == 'true'
        env:
          NEW_KEY: ${{ inputs.new_key }}
        run: python3 ci/app_ci.py publish --new-key "$NEW_KEY" --source "$GITHUB_SHA"

      - name: Save in the repository
        if: steps.decide.outputs.build == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: python3 ci/app_ci.py save --branch "$BRANCH" --message "Android app $VERSION (APK built by GitHub) [skip ci]"

      - name: Summary
        if: always()
        env:
          BUILT: ${{ steps.decide.outputs.build }}
          VERSION: ${{ steps.decide.outputs.version }}
          REASON: ${{ steps.decide.outputs.reason }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Android app"
            if [ "$OUTCOME" = "success" ] && [ "$BUILT" = "true" ]; then
              echo "App **$VERSION** built and saved in \`apk/\`. On the Raspberry: dashboard → Settings → Updates → «Check», then «Update KlippEye»; lastly «Update the app» on the phone."
            elif [ "$OUTCOME" = "success" ]; then
              echo "Nothing to build: $REASON."
            else
              echo "Something went wrong: open the step with the red X above, its message says what to do."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

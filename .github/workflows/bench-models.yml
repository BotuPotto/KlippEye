name: Networks to time on a Raspberry

# The candidate networks for the local model (ml/export_candidates.py), exported to ONNX with random weights: only to
# time them on a printer's Raspberry with `python3 scripts/benchmark.py --models`, which downloads them from here.
# They are attached to the newest KlippEye release as bench-<name>.onnx: no new tag (the update channels only follow
# vX.Y.Z tags, and Moonraker never downloads release files).

on:
  push:
    branches: [main]
    paths: [ml/export_candidates.py, .github/workflows/bench-models.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch (CPU) and the tools
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm onnx opencv-python-headless numpy
      - name: Export the networks
        run: python ml/export_candidates.py --out out
      - name: Attach them to the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tagName')
          [ -n "$tag" ] || { echo "no release to attach to"; exit 1; }
          cd out
          for f in *.onnx; do cp "$f" "bench-$f"; done
          cp candidates.json bench-candidates.json
          gh release upload "$tag" bench-*.onnx bench-candidates.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached to $tag"

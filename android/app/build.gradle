plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The app's version is written in ONE place: android/VERSION ("1.0.0"). From it come the name and the internal number
// Android compares to know whether an APK is newer than the installed one:
//   versionCode = major * 10000 + minor * 100 + patch   (1.0.0 -> 10000, 1.2.3 -> 10203)
// Each number goes from 0 to 99. For a new version, raise the number in android/VERSION.
def versionText = rootProject.file('VERSION').text.trim()
def versionMatch = (versionText =~ /^(\d{1,2})\.(\d{1,2})\.(\d{1,2})$/)
if (!versionMatch.matches()) {
    throw new GradleException("android/VERSION must hold three numbers from 0 to 99 separated by dots (for example 1.0.1): found '${versionText}'")
}
def appVersionCode = versionMatch.group(1).toInteger() * 10000 + versionMatch.group(2).toInteger() * 100 + versionMatch.group(3).toInteger()

// The APK's signature. GitHub's computer adds it (see docs/GUIDE.md, "Building your own Android app"): it passes the key file
// and its password in these variables. On your own computer, without them, the "release" build stays unsigned and the
// "debug" build of Android Studio is signed with its own test key.
def keystoreFile = System.getenv('KLIPPEYE_KEYSTORE')
def keystorePassword = System.getenv('KLIPPEYE_KEYSTORE_PASSWORD')

// Push notifications: Firebase reads its configuration from app/google-services.json (downloaded from the Firebase console).
// Without the file the app is built anyway and receives the notifications through ntfy only.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.klippeye.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.klippeye.app"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName versionText
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias 'klippeye'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lint {
        // lint's warnings must not stop the build of the APK on GitHub's computer
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'

    // the tests of the parts that need no phone (app/src/test): ./gradlew testDebugUnitTest
    testImplementation 'junit:junit:4.13.2'
}
